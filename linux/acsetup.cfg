; Cart Life on Linux and the Steam Deck (AGS 3.6 engine options, see OPTIONS.md)
[graphics]
driver = OGL
windowed = 0
fullscreen = full_window
game_scale_fs = proportional
game_scale_win = max_round
filter = linear
vsync = 1
[sound]
enabled = 1
[touch]
emul_mouse_mode = one_finger
[mouse]
auto_lock = 0
[misc]
datafile = cartlife.exe
[log]
stdout = main:info,game:error
