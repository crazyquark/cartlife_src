# Builds the Linux / Steam Deck AppImage (see linux/build.sh). Download it
# from the run's artifacts.
name: Linux

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version
        default: "1.0"
  push:
    branches: [ios]
    paths: ["linux/**", ".github/workflows/linux.yml"]

jobs:
  appimage:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq ninja-build unar libfuse2 \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev \
            libxss-dev libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev \
            libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev libdrm-dev libgbm-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev libdbus-1-dev libudev-dev libibus-1.0-dev
      - name: Build
        run: linux/build.sh "${{ inputs.version || '1.0' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: cartlife-appimage
          path: dist/*.AppImage
          compression-level: 0
